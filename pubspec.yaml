name: ajyal
description: تطبيق المدرسة العربية الإسلامية - المنتدى العربي الألماني Landshut
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/

# شاشة البداية (الشعار عند فتح التطبيق)
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png

# أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  remove_alpha_ios: true
